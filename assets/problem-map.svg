<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc"><title id="title">AXOVAR: the problem of correlated financial evidence</title><desc id="desc">Two market feeds share one upstream, so their agreement is not independent confirmation. An independent but delayed source cannot immediately resolve the uncertainty. The policy rejects ungrounded certainty.</desc><rect width="1440" height="560" rx="18" fill="#0D1218"/><rect x="1" y="1" width="1438" height="558" rx="17" fill="none" stroke="#2A3745"/><style>text{font-family:Inter,Arial,sans-serif} .sm{font-size:16px;fill:#8095A7;letter-spacing:1px} .label{font-size:22px;font-weight:650;fill:#E3EAF0} .detail{font-size:16px;fill:#A4B4C1} .node{fill:#151F29;stroke:#344758;stroke-width:1.5} .wire{fill:none;stroke:#7094B2;stroke-width:3;stroke-linecap:round} .warn{stroke:#C9A274} .warntext{fill:#DEB681}</style><text x="52" y="61" class="sm">RESEARCH QUESTION / AXV-001</text><text x="52" y="111" font-size="32" fill="#E7EEF4" font-weight="700">When two sources agree, how many independent observations exist?</text>
<rect x="50" y="170" width="310" height="104" rx="10" class="node"/><text x="73" y="209" class="label">UPSTREAM X</text><text x="73" y="241" class="detail">Degraded / common origin</text>
<rect x="50" y="307" width="310" height="104" rx="10" class="node"/><text x="73" y="346" class="label">UPSTREAM Y</text><text x="73" y="378" class="detail">Independent / delayed</text>
<rect x="505" y="172" width="285" height="96" rx="10" class="node"/><text x="531" y="210" class="label">VENUE A + VENUE B</text><text x="531" y="240" class="detail">Correlated evidence</text>
<rect x="505" y="308" width="285" height="96" rx="10" class="node"/><text x="531" y="346" class="label">VENUE C</text><text x="531" y="377" class="detail">Distinct, but late</text>
<path d="M360 222 L505 222" class="wire warn"/><path d="M360 359 L505 359" class="wire"/>
<path d="M790 220 L925 220 L925 282" class="wire warn"/><path d="M790 356 L925 356 L925 282" class="wire"/>
<rect x="955" y="224" width="430" height="158" rx="12" fill="#22221D" stroke="#967C59" stroke-width="2"/><text x="985" y="267" class="sm warntext">EVIDENCE GATE</text><text x="985" y="307" font-size="28" fill="#EDD2A9" font-weight="700">INSUFFICIENT EVIDENCE</text><text x="985" y="342" font-size="16" fill="#C8B69A">Do not infer safety from agreement.</text>
<text x="52" y="479" font-size="18" fill="#C6D4DF">Two reports from one upstream do not prove two independent sources.</text><text x="52" y="516" font-size="15" fill="#8195A6">Illustrative research diagram — not a depiction of verified real-world sources.</text></svg>