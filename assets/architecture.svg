<g><rect x="682" y="121" width="310" height="155" rx="10" class="node"/><text x="704" y="168" class="title">DECISION GATE</text><text x="704" y="204" class="sub">Integrity · concentration</text><text x="704" y="234" class="sub">Evidence-linked receipt</text></g>
