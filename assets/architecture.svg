<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="515" viewBox="0 0 1440 515" role="img" aria-labelledby="title desc"><title id="title">AXOVAR Generation Zero executable architecture</title><desc id="desc">Synthetic CSV fixtures enter the C++20 validation and replay core. The engine computes market state, source integrity, portfolio policy and decision receipts. A Python local API serves a JavaScript dashboard. Tests cover the core and API.</desc><rect width="1440" height="515" rx="18" fill="#0D1218"/><rect x="1" y="1" width="1438" height="513" rx="17" fill="none" stroke="#2A3745"/><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:22px;font-weight:650;fill:#E5EDF4}.sub{font-size:16px;fill:#93A8B9}.cap{font-size:15px;letter-spacing:1px;fill:#7F95A8}.node{fill:#161F29;stroke:#344758;stroke-width:1.5}.line{fill:none;stroke:#6489A8;stroke-width:3}.accent{fill:#A4C6D9}</style>
<text x="48" y="61" class="cap">ACTUAL IMPLEMENTED PATH / GENERATION ZERO</text>
